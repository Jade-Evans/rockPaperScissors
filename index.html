<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="contentContainer">
        <h1>Welcome to Rock, Paper, Scissors!</h1>
        
        <p>Before we begin, please enter your player name and press ENTER:</p>
        <form id="enterName">
            <label for="playerName"></label>
            <input type="text" id="playerName" name="playerName">
            <input type="submit" value="ENTER"/>
        </form>
        <h2>To begin, please pick one of the following options below:</h2>
        <div class="choiceButtonContainer">
            <button class="choiceButton" id="rockButton">🗿Rock</button>
            <button class="choiceButton" id="paperButton">📄Paper</button>
            <button class="choiceButton" id="scissorsButton">✂️Scissors</button>
        </div>
        <div id="announceSelections"></div>
        <div id="resultsAnnouncement"></div>
    </div>

    
    
    <script src="script.js"></script>
</body>
</html>
