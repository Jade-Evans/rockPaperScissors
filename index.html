<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div id="contentContainer">
        <div id="firstContainer">
            <h2 id="welcomeToHeader">LET'S PLAY!</h2>
            <img src="imgs/powerOfThreeIcon.png" id="gameIcon">
            <form id="enterNameForm">
                <p id="enterNameBeforeBegin">Before we begin, please enter your player name and press <span><strong>"ENTER"</strong></span>:</p>
                <label for="playerName"></label>
                <input type="text" id="inputPlayerName" name="playerName" minlength="2"
                maxlength="12">
                <input type="submit" value="ENTER" id="submitPlayerNameButton"/>
            </form>
        </div>
        <div class="welcomeChooseThemeContainer"></div>
        <div class="choiceButtonContainer">
            <button class="choiceButton" id="rockButton">🗿Rock</button>
            <button class="choiceButton" id="paperButton">📄Paper</button>
            <button class="choiceButton" id="scissorsButton">✂️Scissors</button>
        </div>
        <div id="announceSelections"></div>
        <div id="resultsAnnouncement"></div>
    </div>

    
    
    <script src="script.js"></script>
</body>
</html>
